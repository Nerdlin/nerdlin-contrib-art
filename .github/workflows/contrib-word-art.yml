name: Contrib Word Art

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 03:10 UTC
    - cron: '10 3 * * 0'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Render NERDLIN onto contributions
        env:
          # Format: <ID>+<username>@users.noreply.github.com
          AUTHOR_NAME: Nerdlin
          AUTHOR_EMAIL: 180521143+Nerdlin@users.noreply.github.com
        run: |
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          python -m pip install --upgrade pip
          python scripts/contrib_word_art.py --apply --push --intensity 60 --name "$AUTHOR_NAME" --email "$AUTHOR_EMAIL"
